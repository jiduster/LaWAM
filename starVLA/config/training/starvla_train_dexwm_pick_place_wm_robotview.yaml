run_id: dexwm_robocasa_pick_place_stage3_wm_robotview
run_root_dir: results/Checkpoints/dexwm_robocasa_pick_place
seed: 2026
trackers:
- wandb
wandb_entity: null
wandb_project: finetune-DexWM-RoboCasa-PickPlace
is_debug: false
framework:
  name: LaWAM
  qwenvl:
    base_vlm: results/Checkpoints/qwen3_weights
  action_model:
    future_action_window_size: 3
    past_action_window_size: 0
    action_horizon: 4
    lam_ckpt_path: latent_action_model/logs/dino_large_vae/lam_release/checkpoints/pytorch_model.pt
    lam_yaml_path: latent_action_model/logs/dino_large_vae/lam_release/dino_large_vae.yaml
    num_action_queries: 8
    flow_action_num_queries: 8
    perceptual_weight: 0.1
    latent_action_placeholder_token: <ACT_PH>
    flow_only_mode: false
    enable_flow_h_t1_scheduled_sampling: false
    flow_h_t1_pred_prob_start: 0.0
    flow_h_t1_pred_prob_end: 1.0
    flow_h_t1_pred_ramp_steps: 10000
    detach_future_feature: true
    future_prediction: true
    enable_loss_distill: true
    lam_encoder_distill_weight: 0.1
    repeated_diffusion_steps: 2
    flow_cfg:
      action_dim: 25
      state_dim: 25
      use_state: true
      vlm_dim: 2048
      hidden_dim: 1024
      attention_heads: 16
      num_layers: 16
      num_target_vision_tokens: -1
      interleave_self_attention: true
      use_alternate_vldit: true
      attend_text_every_n_blocks: 2
      cfg_drop_prob: 0.0
      cfg_guidance_scale: 1.0
      num_inference_steps: 10
      num_timestep_buckets: 1000
      horizon_sec: 4.0
      noise_beta_alpha: 1.5
      noise_beta_beta: 1.0
      noise_s: 0.999
      token_independent_noise: false
      use_action_positional_embeddings: true
datasets:
  vla_data:
    data_root_dir: /mnt/ceph3/dexwm/robocasa_random_data
    data_mix: dexwm_robocasa_pick_place
    image_resolution: 256
    per_device_batch_size: 8
    val_tail_ratio: 0.01
    train_split_all: false
    split_files:
      train:
      - combine_demos_0.hdf5
      - combine_demos_1.hdf5
      - combine_demos_2.hdf5
      - combine_demos_3.hdf5
      - combine_demos_4.hdf5
      - combine_demos_5.hdf5
      - combine_demos_6.hdf5
      - combine_demos_7.hdf5
      - combine_demos_8.hdf5
      - combine_demos_9.hdf5
      - combine_demos_10.hdf5
      - combine_demos_11.hdf5
      - combine_demos_12.hdf5
      - combine_demos_13.hdf5
      - combine_demos_14.hdf5
      - combine_demos_15.hdf5
      val:
      - combine_demos_16.hdf5
      - combine_demos_17.hdf5
      test:
      - combine_demos_18.hdf5
      - combine_demos_19.hdf5
    num_frames: 2
    sec_chunk: 4.0
    action_horizon: 4
    action_hz_override: 1.0
    stats_sample_rows_per_episode: 256
    primary_video_keys:
    - robot0_robotview_2_image
    - robot0_robotview_image
    wm_primary_video_key: robot0_robotview_image
    wrist_video_key: gripper0_right_right_eye_in_hand_image
    enable_primary_video_aug: false
    enable_primary_random_resized_crop: false
    enable_video_frame_cache: false
trainer:
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 500
  eval_batches: 20
  learning_rate:
    base: 5.0e-05
    action_model:
      lr: 0.0001
      modules:
      - policy_backend.flow
    world_model:
      lr: 5.0e-05
      modules:
      - policy_backend.lam.decoder
    vlm:
      lr: 2.0e-05
      modules:
      - policy_backend.vlm
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze:
    freeze_vision_backbone: false
    freeze_llm_backbone: false
    keep_llm_first_n_layers: 16
    freeze_last_llm_layer: true
    freeze_embedding: true
    unfreeze_vision_merger: true
    unfreeze_llm_last_n_layers: -1
    unfreeze_lam_decoder: true
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  ddp_find_unused_parameters: false
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: results/Checkpoints/dexwm_robocasa/20260625_153429+dexwm_robocasa_stage2/final_model/pytorch_model.pt
  load_pretrained_policy_flow: true
  use_pretrained_dataset_statistics: false
